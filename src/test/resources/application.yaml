spring:
  datasource:
    url: jdbc:h2:mem:socialwalltest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

app:
  uploads:
    directory: target/test-uploads